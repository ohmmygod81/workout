<title>WORKOUT LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #f6f7fa;
    --panel: #ffffff;
    --panel-2: #fbfbfd;
    --panel-input: #eef0f4;
    --border: #e3e5eb;
    --border-input: #d7dae2;
    --border-strong: #bfc3cf;
    --text: #1d1f27;
    --text-secondary: #666a77;
    --muted: #9497a3;
    --accent: #5b6b85;
    --accent-hover: #48566d;
    --accent-dim: #eceef2;
    --success: #22a06b;
    --error: #cf4a44;
    --radius: 10px;
    --safe-t: env(safe-area-inset-top, 0px);

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    min-height: 100dvh;

  #app { min-height: 100vh; min-height: 100dvh; background: var(--bg); }
  input::placeholder { color: var(--muted); }
  input { -webkit-appearance: none; appearance: none; }
  input:focus { outline: none; }
  button { font-family: inherit; -webkit-appearance: none; appearance: none; transition: transform 0.12s ease, opacity 0.12s ease, background-color 0.15s ease, border-color 0.15s ease; }

  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 6px; }

  header { padding: calc(16px + var(--safe-t)) 18px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(246,247,250,0.88); backdrop-filter: blur(10px); z-index: 10; }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  .brand-row { display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-dim); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; color: var(--accent); font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 12px; }
  .brand { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.16em; color: var(--text); }
  .view-tabs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--border-input); border-radius: 9px; padding: 3px; }
  .view-tab { background: none; border: none; color: var(--text-secondary); font-size: 11.5px; font-family: 'Oswald', sans-serif; font-weight: 500; letter-spacing: 0.02em; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .view-tab.active { background: var(--accent); color: #ffffff; }
  .date-nav { display: flex; align-items: center; justify-content: space-between; }
  .nav-btn { background: var(--panel); border: 1px solid var(--border-input); border-radius: 9px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); font-size: 15px; }

  .date-box { display: flex; align-items: center; gap: 9px; }
  .date-label { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 0.01em; }

  .error-banner { background: #241615; border: 1px solid #4a2321; color: var(--error); border-radius: var(--radius); padding: 10px 12px; font-size: 12.5px; line-height: 1.5; margin-bottom: 14px; }
  .sync-badge { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--muted); margin-bottom: 14px; letter-spacing: 0.01em; }
  .sync-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(92,185,138,0.14); }

  .day-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .day-tab { flex: 1 1 28%; background: var(--panel); border: 1px solid var(--border-input); color: var(--text-secondary); border-radius: 9px; padding: 10px 4px; font-size: 12.5px; font-family: 'Oswald', sans-serif; font-weight: 500; cursor: pointer; }

  .chip-name { font-size: 12.5px; color: var(--text); font-weight: 500; }

  .chip-note { font-size: 9.5px; color: #b23b34; max-width: 150px; line-height: 1.35; margin-top: 1px; }

  .detail-title { font-family: 'Oswald', sans-serif; font-size: 13.5px; font-weight: 600; color: var(--accent); margin-bottom: 6px; letter-spacing: 0.01em; }
  .detail-howto { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 11px; }
  .video-link { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 7px 13px; font-size: 11.5px; font-weight: 500; }

  .form-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 22px; }
  .field-label { font-size: 9.5px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 5px; display: block; font-family: 'Oswald', sans-serif; }
  .exercise-wrap { position: relative; margin-bottom: 12px; }
  .input-exercise { width: 100%; height: 44px; background: var(--panel-input); border: 1px solid var(--border-input); border-radius: 9px; padding: 0 13px; color: var(--text); font-size: 14px; font-family: 'IBM Plex Mono', monospace; }
  .input-exercise:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,107,133,0.18); }
  .suggest-box { position: absolute; top: calc(100% + 3px); left: 0; right: 0; background: var(--panel-2); border: 1px solid var(--border-input); border-radius: 9px; overflow: hidden; z-index: 5; box-shadow: 0 8px 20px rgba(0,0,0,0.35); }

  .input-num { background: none; border: none; color: var(--text); font-size: 16px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; width: 100%; min-width: 0; padding: 0; height: 22px; }
  .field-unit { font-size: 9.5px; color: var(--muted); white-space: nowrap; letter-spacing: 0.04em; }
  .add-btn { width: 100%; height: 46px; background: var(--accent); color: #ffffff; border: none; border-radius: 10px; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 13.5px; letter-spacing: 0.05em; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }

  .set-row { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }

  .set-name-row { display: flex; align-items: center; gap: 8px; }

  .set-weight { font-size: 14.5px; font-weight: 600; }
  .set-unit { font-size: 10.5px; color: var(--muted); }
  .set-sep { color: var(--border-strong); margin: 0 3px; }
  .delete-btn { background: none; border: none; padding: 8px; cursor: pointer; color: var(--muted); font-size: 14px; }

  .donut-hole { width: 46px; height: 46px; border-radius: 50%; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-num { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; line-height: 1; }
  .donut-label { font-size: 8px; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; }
  .bar-list { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-name { font-size: 10.5px; color: var(--text-secondary); width: 46px; flex-shrink: 0; }

  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-count { font-size: 10.5px; color: var(--muted); width: 14px; text-align: right; flex-shrink: 0; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-secondary); }
  .cal-legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-weekday { text-align: center; font-size: 10px; color: var(--muted); padding-bottom: 8px; font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; }
  .cal-cell { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 4px 2px; position: relative; overflow: hidden; }
  .cal-cell.empty { visibility: hidden; cursor: default; }
  .cal-cell.today { border-color: var(--accent); }
  .cal-cell.selected { background: var(--accent-dim); border-color: var(--accent); }
  .cal-daynum { font-size: 12px; color: var(--text); font-family: 'IBM Plex Mono', monospace; z-index: 1; }
  .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 32px; z-index: 1; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
  .cal-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; display: flex; }
  .cal-bar span { flex: 1; }
  .cal-month-label { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 600; }
  .setup-banner { background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 16px; font-size: 13px; line-height: 1.6; color: var(--text-secondary); }
  .setup-banner code { background: var(--panel-input); padding: 1px 5px; border-radius: 4px; color: var(--accent); }

  /* body measurements */
  .m-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .input-date { width: 100%; height: 44px; background: var(--panel-input); border: 1px solid var(--border-input); border-radius: 9px; padding: 0 12px; color: var(--text); font-size: 13px; font-family: 'IBM Plex Mono', monospace; }
  .input-date:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,107,133,0.18); }
  .m-part-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .m-part-chip { background: var(--panel-input); border: 1px solid var(--border-input); color: var(--text-secondary); border-radius: 999px; padding: 7px 13px; font-size: 12px; cursor: pointer; }
  .m-part-chip.selected { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .m-group { margin-bottom: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; }
  .m-group-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .m-group-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .m-group-title { font-family: 'Oswald', sans-serif; font-size: 13.5px; font-weight: 600; color: var(--text); letter-spacing: 0.02em; }
  .m-group-latest { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .m-row { padding: 9px 0; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); }
  .m-row:first-child { border-top: none; padding-top: 0; }
  .m-date { font-size: 11.5px; color: var(--muted); }
  .m-value-row { display: flex; align-items: baseline; gap: 8px; }
  .m-value { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600; }
  .m-delta { font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 5px; }
  .m-delta.up { color: var(--success); background: rgba(34,160,107,0.12); }
  .m-delta.down { color: var(--error); background: rgba(207,74,68,0.12); }
</style>

      { name: "어시스트 친업", reps: 10, setCount: 3, howTo: "어시스트 무게를 몸무게 대비 조절, 턱이 바 위로 오도록 끝까지 당기기" },
      { name: "티바로우", reps: 20, setCount: 3, howTo: "허리는 곧게 편 채 팔꿈치를 몸통에 붙여 배꼽 쪽으로 당기기" },
      { name: "시티드로우", reps: 20, setCount: 3, howTo: "상체 반동 없이 견갑골을 모으며 손잡이를 명치 쪽으로 당기기" },
    ]},
    { label: "이두+삼두", exercises: [
      { name: "이지바 컬", reps: 20, setCount: 3, howTo: "팔꿈치 고정하고 반동 없이 컬, 내릴 때 천천히 컨트롤" },
      { name: "덤벨 해머컬", reps: 20, setCount: 3, howTo: "손바닥이 서로 마주보게 잡고 팔꿈치 고정한 채 들어올리기" },
      { name: "케이블 푸쉬다운", reps: 20, setCount: 3, howTo: "팔꿈치를 옆구리에 고정, 팔뚝만 사용해 끝까지 펴기" },
      { name: "스컬크러셔", reps: 20, setCount: 3, howTo: "팔꿈치는 고정한 채 이마 위쪽으로 내렸다가 삼두로 밀어올리기" },
    ]},
  ];
  const youtubeSearchUrl = (name) => `https://www.youtube.com/results?search_query=${encodeURIComponent(name + " 자세")}`;

  const EXERCISE_TO_PART = {};
  PRESETS.forEach((day) => { day.exercises.forEach((ex) => { EXERCISE_TO_PART[ex.name] = day.label; }); });
  const PART_COLORS = {
    "하체": "#4f9d69",
    "어깨": "#5b8dd9",
    "가슴": "#d9605b",
    "등": "#a778d9",
    "이두+삼두": "#d98f3f",
    "기타": "#6b6b6b",
  };
  const partOf = (exerciseName) => EXERCISE_TO_PART[exerciseName] || "기타";
  const hexToRgba = (hex, alpha) => {
    const h = hex.replace("#", "");
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  };

  const BODY_PART_PRESETS = ["팔(알통)", "가슴둘레", "허리둘레", "허벅지", "종아리", "어깨너비", "체중"];

  /* ---------- Firestore-backed data functions ---------- */
  async function fetchDay(date) {
    const snap = await fb.getDoc(fb.doc(db, "days", date));
    return snap.exists() ? (snap.data().sets || []) : [];
  }
  async function saveDay(date, sets) {
    await fb.setDoc(fb.doc(db, "days", date), { sets });
  }
  async function fetchExerciseList() {
    const snap = await fb.getDoc(fb.doc(db, "meta", "exercises"));
    return snap.exists() ? (snap.data().names || []) : [];
  }
  async function addExerciseToIndex(name) {
    const list = await fetchExerciseList();
    if (!list.includes(name)) {
      list.push(name);
      await fb.setDoc(fb.doc(db, "meta", "exercises"), { names: list });
    }
    return list;
  }
  async function fetchPr(name) {
    const snap = await fb.getDoc(fb.doc(db, "prs", name));
    return snap.exists() ? snap.data() : null;
  }
  async function checkAndSavePr(name, weight, reps, date) {
    const current = await fetchPr(name);
    if (!current || weight > current.weight) {
      const newPr = { weight, reps, date };
      await fb.setDoc(fb.doc(db, "prs", name), newPr);
      return newPr;
    }
    return current;
  }
  async function fetchLast(name) {
    const snap = await fb.getDoc(fb.doc(db, "last", name));
    return snap.exists() ? snap.data() : null;
  }
  async function saveLast(name, weight, reps) {
    await fb.setDoc(fb.doc(db, "last", name), { weight, reps });
  }
  async function saveMeasurement(id, date, part, value) {
    await fb.setDoc(fb.doc(db, "measurements", id), { date, part, value });
  }
  async function deleteMeasurement(id) {
    await fb.deleteDoc(fb.doc(db, "measurements", id));
  }

  /* ---------- state ---------- */
  const state = {
    view: "day", // "day" | "calendar" | "body"
    date: todayStr(),
    calendarMonth: todayStr().slice(0, 7),
    sets: [],
    exerciseList: [],
    monthData: {}, // date -> sets[]
    activeDay: null,
    selectedExercise: null,
    form: { exercise: "", weight: "", reps: "", setCount: "" },
    showSuggest: false,
    error: null,
    loadingDay: true,
    loadingMonth: true,
    prCache: {},
    prFetching: new Set(),
    measurements: [], // {id, date, part, value}
    loadingMeasurements: true,
    mForm: { date: todayStr(), part: "", value: "" },
    mShowSuggest: false,
    expandedPart: null,
  };

  let unsubDay = null;
  let unsubMonth = null;
  let unsubExercises = null;
  let unsubMeasurements = null;

  function subscribeExercises() {
    if (!firebaseReady) return;
    unsubExercises = fb.onSnapshot(fb.doc(db, "meta", "exercises"),
      (snap) => { state.exerciseList = snap.exists() ? (snap.data().names || []) : []; render(); },
      () => {}
    );
  }

  function subscribeMeasurements() {
    if (!firebaseReady) return;
    state.loadingMeasurements = true;
    unsubMeasurements = fb.onSnapshot(fb.collection(db, "measurements"),
      (snap) => {
        const list = [];
        snap.forEach((docSnap) => { list.push({ id: docSnap.id, ...docSnap.data() }); });
        state.measurements = list;
        state.loadingMeasurements = false;
        render();
      },
      (err) => { state.error = "동기화 오류: " + err.message; state.loadingMeasurements = false; render(); }
    );
  }

  function subscribeDay(date) {
    if (unsubDay) { unsubDay(); unsubDay = null; }
    if (!firebaseReady) return;
    state.loadingDay = true;
    const timeoutId = setTimeout(() => {
      if (state.loadingDay) {
        state.error = "Firebase 서버 응답이 없어. 실제 브라우저(사파리)로 열었는지, GitHub Pages 주소로 접속했는지, Firestore Database가 생성됐는지 확인해줘.";
        state.loadingDay = false;
        render();
      }
    }, 8000);
    unsubDay = fb.onSnapshot(fb.doc(db, "days", date),
      (snap) => {
        clearTimeout(timeoutId);
        state.sets = snap.exists() ? (snap.data().sets || []) : [];
        state.loadingDay = false;
        state.error = null;
        render();
      },
      (err) => { clearTimeout(timeoutId); state.error = "동기화 오류: " + err.message; state.loadingDay = false; render(); }
    );
  }

  function subscribeMonth(yearMonth) {
    if (unsubMonth) { unsubMonth(); unsubMonth = null; }
    if (!firebaseReady) return;
    state.loadingMonth = true;
    const start = `${yearMonth}-01`;
    const [y, m] = yearMonth.split("-").map(Number);
    const lastDay = new Date(y, m, 0).getDate();
    const end = `${yearMonth}-${pad(lastDay)}`;
    const q = fb.query(
      fb.collection(db, "days"),
      fb.where(fb.documentId(), ">=", start),
      fb.where(fb.documentId(), "<=", end)
    );
    const timeoutId = setTimeout(() => {
      if (state.loadingMonth) {
        state.error = "Firebase 서버 응답이 없어. 실제 브라우저(사파리)로 열었는지, GitHub Pages 주소로 접속했는지, Firestore Database가 생성됐는지 확인해줘.";
        state.loadingMonth = false;
        render();
      }
    }, 8000);
    unsubMonth = fb.onSnapshot(q,
      (snap) => {
        clearTimeout(timeoutId);
        const map = {};
        snap.forEach((docSnap) => { map[docSnap.id] = docSnap.data().sets || []; });
        state.monthData = map;
        state.loadingMonth = false;
        render();
      },
      (err) => { clearTimeout(timeoutId); state.error = "동기화 오류: " + err.message; state.loadingMonth = false; render(); }
    );
  }

  /* ---------- actions ---------- */
  async function handleAdd() {
    const weight = parseFloat(state.form.weight);
    const reps = parseInt(state.form.reps, 10);
    const setCount = parseInt(state.form.setCount, 10) || 1;
    if (!state.form.exercise.trim() || isNaN(weight) || isNaN(reps)) return;

    const exercise = state.form.exercise.trim();
    const entry = { id: `${Date.now()}`, exercise, weight, reps, setCount };
    const newSets = [...state.sets, entry];
    try {
      await saveDay(state.date, newSets);
      await addExerciseToIndex(exercise);
      const pr = await checkAndSavePr(exercise, weight, reps, state.date);
      state.prCache[exercise] = pr;
      await saveLast(exercise, weight, reps);
      state.form = { exercise: "", weight: "", reps: "", setCount: "" };
      state.error = null;
    } catch (e) {
      state.error = "저장 실패: " + (e.message || "다시 시도해줘.");
    }
    render();
  }

  async function handleDelete(id) {
    const newSets = state.sets.filter((s) => s.id !== id);
    try {
      await saveDay(state.date, newSets);
      state.error = null;
    } catch (e) {
      state.error = "삭제 실패: " + (e.message || "다시 시도해줘.");
    }
    render();
  }

  async function handlePresetPick(dayLabel, exName) {
    const day = PRESETS.find((d) => d.label === dayLabel);
    const ex = day.exercises.find((e) => e.name === exName);
    state.selectedExercise = ex;
    render();
    let weight = "";
    try {
      const last = await fetchLast(ex.name);
      if (last) weight = last.weight;
    } catch {}
    state.form = {
      exercise: ex.name,
      weight: weight === "" ? "" : String(weight),
      reps: String(ex.reps),
      setCount: String(ex.setCount),
    };
    render();
  }

  function goToDay(date) {
    state.view = "day";
    state.date = date;
    state.error = null;
    subscribeDay(date);
    render();
  }

  function setMonth(ym) {
    state.calendarMonth = ym;
    subscribeMonth(ym);
    render();
  }

  async function handleAddMeasurement() {
    const part = state.mForm.part.trim();
    const value = parseFloat(state.mForm.value);
    const date = state.mForm.date;
    if (!part || isNaN(value) || !date) return;
    const id = `${date}__${part}`;
    try {
      await saveMeasurement(id, date, part, value);
      state.mForm = { date, part: "", value: "" };
      state.error = null;
    } catch (e) {
      state.error = "저장 실패: " + (e.message || "다시 시도해줘.");
    }
    render();
  }

  async function handleDeleteMeasurement(id) {
    try {
      await deleteMeasurement(id);
      state.error = null;
    } catch (e) {
      state.error = "삭제 실패: " + (e.message || "다시 시도해줘.");
    }
    render();
  }

  async function fetchPrAndCache(name) {
    if (state.prCache[name] !== undefined || state.prFetching.has(name)) return;
    state.prFetching.add(name);
    try {
      state.prCache[name] = await fetchPr(name);
    } catch {
      state.prCache[name] = null;
    }
    state.prFetching.delete(name);
    render();
  }

  /* ---------- render ---------- */
  const app = document.getElementById("app");

  function renderSetupBanner() {
    app.innerHTML = `
      <div class="page">

  function renderStatCard() {
    const counts = {};
    Object.values(state.monthData).forEach((sets) => {
      const parts = Array.from(new Set(sets.map((s) => partOf(s.exercise))));
      parts.forEach((p) => { counts[p] = (counts[p] || 0) + 1; });
    });
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    if (total === 0) return "";
    const order = Object.keys(PART_COLORS).filter((k) => k !== "기타" && counts[k]);
    let acc = 0;
    const gradientStops = order.map((p) => {
      const pct = (counts[p] / total) * 100;
      const from = acc;
      acc += pct;
      return `${PART_COLORS[p]} ${from}% ${acc}%`;
    }).join(", ");
    const maxCount = Math.max(...order.map((p) => counts[p]));
    return `
      <div class="stat-card">
        <div class="donut" style="background:conic-gradient(${gradientStops});">
          <div class="donut-hole">
            <span class="donut-num">${total}</span>
            <span class="donut-label">SESSIONS</span>
          </div>
        </div>
        <div class="bar-list">
          ${order.map((p) => `
            <div class="bar-row">
              <span class="bar-name">${esc(p)}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${(counts[p] / maxCount) * 100}%;background:${PART_COLORS[p]}"></div></div>
              <span class="bar-count">${counts[p]}</span>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  function renderCalendarView() {
    const [y, m] = state.calendarMonth.split("-").map(Number);
    const firstDay = new Date(y, m - 1, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(`${y}-${pad(m)}-${pad(d)}`);
    const weekdays = ["일", "월", "화", "수", "목", "금", "토"];

    return `
      ${renderSyncBadge()}
      ${state.error ? `<div class="error-banner">${esc(state.error)}</div>` : ""}
      ${state.loadingMonth ? "" : renderStatCard()}
      <div class="cal-legend">
        ${Object.keys(PART_COLORS).filter((k) => k !== "기타").map((part) => `
          <div class="cal-legend-item"><span class="cal-legend-dot" style="background:${PART_COLORS[part]}"></span>${esc(part)}</div>
        `).join("")}
      </div>
      <div class="cal-grid">
        ${weekdays.map((w) => `<div class="cal-weekday">${w}</div>`).join("")}
        ${state.loadingMonth ? `<div class="empty-state" style="grid-column:1/-1;">불러오는 중...</div>` :
          cells.map((date) => {
            if (!date) return `<div class="cal-cell empty"></div>`;
            const d = parseInt(date.slice(-2), 10);
            const sets = state.monthData[date] || [];
            const parts = Array.from(new Set(sets.map((s) => partOf(s.exercise))));
            const isToday = date === todayStr();
            const isSelected = date === state.date;
            const tintStyle = parts.length === 1 && !isSelected ? `background:${hexToRgba(PART_COLORS[parts[0]], 0.16)};` : "";
            return `
              <div class="cal-cell ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}" style="${tintStyle}" data-goto-day="${date}">
                <span class="cal-daynum">${d}</span>
                <div class="cal-dots">
                  ${parts.slice(0, 5).map((p) => `<span class="cal-dot" style="background:${PART_COLORS[p]}"></span>`).join("")}
                </div>
                ${parts.length > 0 ? `<div class="cal-bar">${parts.map((p) => `<span style="background:${PART_COLORS[p]}"></span>`).join("")}</div>` : ""}
              </div>
            `;
          }).join("")
        }
      </div>
    `;
  }

  function buildSparkline(points, color) {
    const w = 96, h = 34, pad = 4;
    if (points.length === 1) {
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><circle cx="${w / 2}" cy="${h / 2}" r="3" fill="${color}" /></svg>`;
    }
    const values = points.map((p) => p.value);
    const min = Math.min(...values), max = Math.max(...values);
    const range = max - min || 1;
    const stepX = (w - pad * 2) / (points.length - 1);
    const coords = points.map((p, i) => {
      const x = pad + i * stepX;
      const y = h - pad - ((p.value - min) / range) * (h - pad * 2);
      return [x, y];
    });
    const linePath = coords.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const areaPath = `${linePath} L${coords[coords.length - 1][0].toFixed(1)},${h} L${coords[0][0].toFixed(1)},${h} Z`;
    const last = coords[coords.length - 1];
    return `
      <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
        <path d="${areaPath}" fill="${color}" opacity="0.12" />
        <path d="${linePath}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
        <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="${color}" />
      </svg>
    `;
  }

  function renderBodyView() {
    const filteredSuggestions = BODY_PART_PRESETS.filter(
      (e) => state.mForm.part && e.includes(state.mForm.part) && e !== state.mForm.part
    );

    const groups = {};
    state.measurements.forEach((m) => {
      if (!groups[m.part]) groups[m.part] = [];
      groups[m.part].push(m);
    });
    Object.values(groups).forEach((arr) => arr.sort((a, b) => (a.date < b.date ? 1 : -1)));
    const partNames = Object.keys(groups).sort();

    return `
      ${renderSyncBadge()}
      ${state.error ? `<div class="error-banner">${esc(state.error)}</div>` : ""}

      <div class="form-card">
        <div class="m-form-row">
          <div>
            <span class="field-label">날짜</span>
            <input class="input-date" id="mDateInput" type="date" value="${esc(state.mForm.date)}" />
          </div>
          <div>
            <span class="field-label">사이즈</span>
            <div class="field-group">
              <input class="input-num" id="mValueInput" type="number" inputmode="decimal" placeholder="0" value="${esc(state.mForm.value)}" />
              <span class="field-unit">CM</span>
            </div>
          </div>
        </div>
        <div class="exercise-wrap">
          <span class="field-label">부위</span>
          <input class="input-exercise" id="mPartInput" placeholder="예: 팔(알통), 허벅지..." value="${esc(state.mForm.part)}" autocomplete="off" />
          ${state.mShowSuggest && filteredSuggestions.length > 0 ? `
            <div class="suggest-box">
              ${filteredSuggestions.slice(0, 6).map((s) => `<div class="suggest-item" data-m-suggest="${esc(s)}">${esc(s)}</div>`).join("")}
            </div>
          ` : ""}
        </div>
        <div class="m-part-chips">
          ${BODY_PART_PRESETS.map((p) => `
            <button class="m-part-chip ${state.mForm.part === p ? "selected" : ""}" data-m-chip="${esc(p)}">${esc(p)}</button>
          `).join("")}
        </div>
        <button class="add-btn" id="mAddBtn">+ 기록 추가</button>
      </div>

      <div class="list-section">
        ${state.loadingMeasurements ? `<div class="empty-state"><span>불러오는 중...</span></div>` :
          partNames.length === 0 ? `<div class="empty-state"><span>아직 기록이 없어. 위에서 추가해봐.</span></div>` :
          partNames.map((part, gi) => {
            const asc = [...groups[part]].sort((a, b) => (a.date > b.date ? 1 : -1));
            const latest = groups[part][0];
            const earliest = asc[0];
            const totalDiff = Math.round((latest.value - earliest.value) * 10) / 10;
            const sparkColor = ["#5b6b85", "#4f9d69", "#c8514c", "#a778d9", "#3f8fb0"][gi % 5];
            return `
            <div class="m-group">
              <div class="m-group-header" data-m-toggle="${esc(part)}">
                <div class="m-group-left">
                  <div class="m-group-title">${esc(part)}</div>
                  <div class="m-group-latest">${latest.value}cm ${totalDiff !== 0 ? `<span class="m-delta ${totalDiff > 0 ? "up" : "down"}">${totalDiff > 0 ? "+" : ""}${totalDiff}</span>` : ""}</div>
                </div>
                ${buildSparkline(asc, sparkColor)}
              </div>
              ${state.expandedPart === part ? `<div style="margin-top:12px;">${groups[part].map((m, idx) => {
                const prev = groups[part][idx + 1];
                let delta = "";
                if (prev) {
                  const diff = Math.round((m.value - prev.value) * 10) / 10;
                  if (diff !== 0) delta = `<span class="m-delta ${diff > 0 ? "up" : "down"}">${diff > 0 ? "+" : ""}${diff}cm</span>`;
                }
                return `
                  <div class="m-row">
                    <span class="m-date">${esc(fmtDateLabel(m.date))}</span>
                    <div class="m-value-row">
                      <span class="m-value">${m.value}<span style="font-size:11px;color:var(--muted);"> cm</span></span>
                      ${delta}
                      <button class="delete-btn" data-m-delete="${esc(m.id)}">✕</button>
                    </div>
                  </div>
                `;
              }).join("")}</div>` : ""}
            </div>
          `;
          }).join("")
        }
      </div>
    `;
  }

  function render() {
    if (!firebaseReady) { renderSetupBanner(); return; }
    const viewHtml = state.view === "day" ? renderDayView() : state.view === "calendar" ? renderCalendarView() : renderBodyView();
    app.innerHTML = `<div class="page">${renderHeader()}<main>${viewHtml}</main></div>`;
    attachEvents();
  }

  function attachEvents() {
    const q = (sel) => app.querySelector(sel);
    const qa = (sel) => app.querySelectorAll(sel);

    const tabDay = q("#tabDay");
    if (tabDay) tabDay.onclick = () => { state.view = "day"; render(); };
    const tabCal = q("#tabCalendar");
    if (tabCal) tabCal.onclick = () => {
      state.view = "calendar";
      state.calendarMonth = state.date.slice(0, 7);
      subscribeMonth(state.calendarMonth);
      render();
    };
    const tabBody = q("#tabBody");
    if (tabBody) tabBody.onclick = () => { state.view = "body"; render(); };

    const prev = q("#prevDay");
    if (prev) prev.onclick = () => goToDay(addDays(state.date, -1));
    const next = q("#nextDay");
    if (next) next.onclick = () => goToDay(addDays(state.date, 1));
    const gotoToday = q("#gotoToday");
    if (gotoToday) gotoToday.onclick = () => goToDay(todayStr());

    const prevMonth = q("#prevMonth");
    if (prevMonth) prevMonth.onclick = () => setMonth(addMonths(state.calendarMonth, -1));
    const nextMonth = q("#nextMonth");
    if (nextMonth) nextMonth.onclick = () => setMonth(addMonths(state.calendarMonth, 1));

    qa("[data-goto-day]").forEach((cell) => {
      cell.onclick = () => goToDay(cell.getAttribute("data-goto-day"));
    });

    qa(".day-tab").forEach((btn) => {
      btn.onclick = () => {
        const day = btn.getAttribute("data-day");
        state.activeDay = state.activeDay === day ? null : day;
        state.selectedExercise = null;
        render();
      };
    });

    qa("[data-pick-day]").forEach((btn) => {
      btn.onclick = () => handlePresetPick(btn.getAttribute("data-pick-day"), btn.getAttribute("data-pick-ex"));
    });

    const exInput = q("#exerciseInput");
    if (exInput) {
      exInput.oninput = (e) => { state.form.exercise = e.target.value; state.showSuggest = true; render(); focusEnd("exerciseInput"); };
      exInput.onfocus = () => { state.showSuggest = true; };
      exInput.onblur = () => { setTimeout(() => { state.showSuggest = false; render(); }, 150); };
    }
    qa("[data-suggest]").forEach((el) => {
      el.onmousedown = () => { state.form.exercise = el.getAttribute("data-suggest"); render(); };
    });

    const weightInput = q("#weightInput");
    if (weightInput) weightInput.oninput = (e) => { state.form.weight = e.target.value; };
    const repsInput = q("#repsInput");
    if (repsInput) repsInput.oninput = (e) => { state.form.reps = e.target.value; };
    const setCountInput = q("#setCountInput");
    if (setCountInput) setCountInput.oninput = (e) => { state.form.setCount = e.target.value; };

    const addBtn = q("#addBtn");
    if (addBtn) addBtn.onclick = handleAdd;

    qa("[data-delete]").forEach((btn) => {
      btn.onclick = () => handleDelete(btn.getAttribute("data-delete"));
    });

    const mDateInput = q("#mDateInput");
    if (mDateInput) mDateInput.oninput = (e) => { state.mForm.date = e.target.value; };
    const mValueInput = q("#mValueInput");
    if (mValueInput) mValueInput.oninput = (e) => { state.mForm.value = e.target.value; };
    const mPartInput = q("#mPartInput");
    if (mPartInput) {
      mPartInput.oninput = (e) => { state.mForm.part = e.target.value; state.mShowSuggest = true; render(); focusEnd("mPartInput"); };
      mPartInput.onfocus = () => { state.mShowSuggest = true; };
      mPartInput.onblur = () => { setTimeout(() => { state.mShowSuggest = false; render(); }, 150); };
    }
    qa("[data-m-suggest]").forEach((el) => {
      el.onmousedown = () => { state.mForm.part = el.getAttribute("data-m-suggest"); render(); };
    });
    qa("[data-m-chip]").forEach((btn) => {
      btn.onclick = () => { state.mForm.part = btn.getAttribute("data-m-chip"); render(); };
    });
    const mAddBtn = q("#mAddBtn");
    if (mAddBtn) mAddBtn.onclick = handleAddMeasurement;
    qa("[data-m-delete]").forEach((btn) => {
      btn.onclick = (ev) => { ev.stopPropagation(); handleDeleteMeasurement(btn.getAttribute("data-m-delete")); };
    });
    qa("[data-m-toggle]").forEach((el) => {
      el.onclick = () => {
        const part = el.getAttribute("data-m-toggle");
        state.expandedPart = state.expandedPart === part ? null : part;
        render();
      };
    });
  }

  function focusEnd(id) {
    const el = document.getElementById(id);
    if (el) { el.focus(); const v = el.value; el.value = ""; el.value = v; }
  }

  /* ---------- init ---------- */
  initFirebase();
  if (firebaseReady) {
    subscribeExercises();
    subscribeDay(state.date);
    subscribeMeasurements();
  }
  render();
})({ initializeApp, getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection, query, where, documentId });
</script>
</body>
</html>
